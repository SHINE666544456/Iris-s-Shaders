name: Main

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed only so the release step can attach the jar

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs Gradle 9.6.0 directly, so no gradlew or wrapper jar is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: gradle build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lightshader-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources')
          gh release upload "${{ github.event.release.tag_name }}" "$JAR" --clobber
